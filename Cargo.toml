[workspace]
resolver = "2"
members = ["crates/sss-gf256", "crates/jams-recovery-kit"]
# The fuzz crate is its own workspace (nightly-only libfuzzer-sys); it is
# never swept into `cargo test --workspace` here.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/<owner>/jams-recovery-kit"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
